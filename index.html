<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>

 body {
            background-color: #lightpink;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: hotpink;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .result {
            font-weight: bold;
            font-size: 1.3em;
        }
        

        }
        .output-box {
            background-color: black;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }

          #instructions {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .show {
            display: block !important;
            opacity: 1;
        }
    </style>


</head>
<body background="pinkpink.jpg" >

<div class="container text-center">
        <h1 class="mb-3">BMI Calculator!</h1>
        <p>Calculate your Body Mass Index (BMI) to determine your weight category.
        	<br>
        Input your weight in kilograms and height in meters to get your BMI </p>


        <div class="card p-4">
            <div class="mb-3">
                <label for="weight" class="form-label">Weight (kg):</label>
                <input type="number" id="weight" class="form-control" placeholder="Enter weight">
            </div>
            <div class="mb-3">
                <label for="height" class="form-label">Height (meters):</label>
                <input type="number" id="height" class="form-control" placeholder="Enter height">
            </div>
            <button class="btn btn-warning" onclick="calculateBMI()">Calculate BMI</button>
            <p class="mt-3 result" id="bmiResult"></p>
        </div>


        <script>

  function calculateBMI() {
            // Get input values
            let weight = parseFloat(document.getElementById('weight').value);
            let height = parseFloat(document.getElementById('height').value);
            
            // Validate input
            if (isNaN(weight) || isNaN(height) || height <= 0) {
                document.getElementById('bmiResult').innerHTML = "Please enter valid values.";
                return;
            }
            
            // Calculate BMI
            let bmi = weight / Math.pow(height, 2);
            let category;
            
            // Determine category
            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                category = "Normal weight";
            } else if (bmi >= 25 && bmi <= 29.9) {
                category = "Overweight";
            } else {
                category = "Obese";
            }
            
            // Display result
            document.getElementById('bmiResult').innerHTML = `Your BMI is ${bmi.toFixed(2)} - ${category}`;
        }
    </script>


</body>
</html>
